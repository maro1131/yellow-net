<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>YellowNet — Вход</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">YellowNet<span>●</span></div>
            {% if error %}
                <p style="color: #ef4444; margin-bottom: 15px; font-size: 14px;">{{ error }}</p>
            {% endif %}
            
            <form id="loginForm" action="/login" method="POST">
                <input type="text" name="username" class="input-field" placeholder="Логин" required>
                <input type="password" name="password" class="input-field" placeholder="Пароль" required>
                <button type="submit" class="btn-primary">Войти</button>
            </form>
            
            <form id="registerForm" action="/register" method="POST" style="display: none;">
                <input type="text" name="username" class="input-field" placeholder="Логин" required>
                <input type="email" name="email" class="input-field" placeholder="Email" required>
                <input type="text" name="phone" class="input-field" placeholder="Телефон" required>
                <input type="password" name="password" class="input-field" placeholder="Пароль" required>
                <button type="submit" class="btn-primary">Создать аккаунт</button>
            </form>

            <a href="#" onclick="toggleAuth(event)" style="color: #a1a1aa; font-size: 13px; display: block; margin-top: 20px; text-decoration: none;">Нет аккаунта? Создать</a>
        </div>
    </div>

    <script>
        let isLogin = true;
        function toggleAuth(e) {
            e.preventDefault();
            isLogin = !isLogin;
            document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
            document.getElementById('registerForm').style.display = isLogin ? 'none' : 'block';
            e.target.innerText = isLogin ? 'Нет аккаунта? Создать' : 'Уже есть аккаунт? Войти';
        }
    </script>
</body>
</html>
